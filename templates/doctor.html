<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/static/css/doctor.css?v={{version}}">
  <link rel="stylesheet" href="/static/css/notifications.css?v={{version}}">
</head>

<body>
  <div class="sidebar">
    <h2>UStay Doctor</h2>
    <a href="#" class="tab-link active" data-tab="patients">Patients</a>
    <a href="#" class="tab-link" data-tab="profile">Profile</a>
    <div class="sidebar-spacer"></div>


    <button class="logout-btn" onclick="logout()">
      Logout
    </button>
  </div>

  <div class="main-content">
    <div id="notification" class="notification"></div>

    <!-- Patients Tab -->
    <div class="tab-content" id="patients-tab">
      <div>
        <h2>Patients</h2>

      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Gender</th>
              <th>Age</th>
              <th>Antecedents</th>
              <th>Tumor Status</th>
              <th>Hospitalisation</th>
              <th>Final State</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="patients-table">
          </tbody>
        </table>
      </div>
    </div>

    <!-- profile Tab -->
    <div class="tab-content" id="profile-tab" style="display:none;">
      <div class="header">
        <h2>Profile</h2>
      </div>

      <div class="profile-info" style="margin-bottom: 20px;">
        <p><strong>Phone Number:</strong> <span id="user-phone"> - </span></p>
        <p><strong>Role:</strong> <span id="user-role"> - </span></p>
      </div>

      <button class="btn-update" id="change-password-btn" onclick="openModal('change-password-modal')">Change
        Password</button>
    </div>


    <!-- add general symptoms  -->


    <div class="modal" id="delete-confirm-modal">
      <div class="modal-content delete-modal">
        <h3 class="modal-title">Confirm Delete</h3>
        <p id="delete-message">Are you sure?</p>
        <input type="hidden" id="delete-id" />
        <div class="delete-actions">
          <button class="btn-confirm" id="confirm-delete-btn">
            <span id="delete-text">Yes, Delete</span>
            <span id="delete-spinner" class="spinner" style="display:none;"></span>
          </button>
          <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
        </div>
      </div>
    </div>
    <!-- Change Password Modal -->
    <div class="modal" id="change-password-modal">
      <div class="modal-content">
        <span class="close-modal" id="close-password-modal" onclick="closeModal('change-password-modal')">&times;</span>
        <h3>Change Password</h3>
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="Enter new password">

        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm new password">

        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:15px;">
          <button class="btn-add" id="submit-changepwd-btn" onclick="change_password()">
            <span id="changepwd-submit-text">Submit</span>
            <span id="changepwd-submit-spinner" class="spinner" style="display:none;"></span>
          </button>
          <button class="btn-delete" onclick="closeModal('change-password-modal')">Cancel</button>
        </div>
      </div>
    </div>

</body>
<script src="/static/js/notification.js?v={{version}}"></script>
<script src="/static/js/doctor.js?v={{version}}"></script>

</html>
