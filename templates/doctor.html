<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/static/css/doctor.css?v={{version}}">
  <link rel="stylesheet" href="/static/css/notifications.css?v={{version}}">
</head>

<body>
  <div class="notifications" id="notifications"></div>
  <div class="sidebar">
    <h2>UStay Doctor</h2>
    <a href="#" class="tab-link active" data-tab="patients">Patients</a>
    <a href="#" class="tab-link" data-tab="checks">Checks</a>
  </div>

  <div class="main-content">
    <div id="notification" class="notification"></div>

    <!-- Patients Tab -->
    <div class="tab-content" id="patients-tab">
      <div>
        <h2>Patients</h2>

      </div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Age</th>
            <th>Antecedents</th>
            <th>Tumor Status</th>
            <th>Hospitalisation</th>
            <th>Final State</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="patients-table">
        </tbody>
      </table>
    </div>

    <!-- Checks Tab -->
    <div class="tab-content" id="checks-tab" style="display:none;">
      <div class="">

        <h2>Checks</h2>
      </div>
      <table>
        <thead>
          <tr>

            <th>Name</th>
            <th>Gender</th>
            <th>Age</th>
            <th>Antecedents</th>
            <th>Tumor Status</th>
            <th>Hospitalisation</th>
            <th>Final State</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="checks-table">

        </tbody>
      </table>
    </div>



    <!-- add general symptoms  -->
    <div class="modal" id="add-gs-modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeModal('add-gs-modal')">&times;</span>
        <h3>Add General Symptoms</h3>

        <label for="gs-headaches">Headaches</label>
        <select id="gs-headaches">
          <option value="">Select Headaches</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>

        <label for="gs-seizures">Seizures</label>
        <select id="gs-seizures">
          <option value="">Select Seizures</option>
          <option value="M">M</option>
          <option value="TC">TC</option>
          <option value="C">C</option>
          <option value="S">S</option>
        </select>

        <label for="gs-fatigue">Fatigue</label>
        <select id="gs-fatigue">
          <option value="">Select Fatigue</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>

        <label for="gs-drowsiness">Drowsiness</label>
        <select id="gs-drowsiness">
          <option value="">Select Drowsiness</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>

        <label for="gs-sleep_pb">Sleep problems</label>
        <select id="gs-sleep_pb">
          <option value="">Select Sleep problems</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>

        <label for="gs-memory_pb">Memory problems</label>
        <select id="gs-memory_pb">
          <option value="">Select Memory problems</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>

        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:15px;">
          <button class="btn-add" id="submit-gs-btn" onclick="">
            <span id="gs-submit-text">Submit</span>
            <span id="gs-submit-spinner" class="spinner" style="display:none;"></span>
          </button>
          <button class="btn-delete" onclick="closeModal('add-gs-modal')">Cancel</button>
        </div>
      </div>
    </div>

    <!-- add Spec Symp -->
    <div class="modal" id="add-ss-modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeModal('add-ss-modal')">&times;</span>
        <h3>Add Specific Symptoms</h3>

        <label for="ss-pressure">Pressure</label>
        <select id="ss-pressure">
          <option value="">Select Pressure</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>

        <label for="ss-balance_loss">Balance loss</label>
        <select id="ss-balance_loss">
          <option value="">Select Balance loss</option>
          <option value="0">0</option>
          <option value="1">1</option>
        </select>

        <label for="ss-judgment_degradation">Judgment degradation</label>
        <select id="ss-judgment_degradation">
          <option value="">Select Judgment degradation</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>

        <label for="ss-sense_degradation">Sense degradation</label>
        <select id="ss-sense_degradation">
          <option value="">Select Sense degradation</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>

        <label for="ss-lactation">Lactation</label>
        <select id="ss-lactation">
          <option value="">Select Lactation</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>

        <label for="ss-swallowing">Swallowing</label>
        <select id="ss-swallowing">
          <option value="">Select Swallowing</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>

        <label for="ss-muscle">Muscle</label>
        <select id="ss-muscle">
          <option value="">Select Muscle</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>



        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:15px;">
          <button class="btn-add" id="submit-ss-btn" onclick="">
            <span id="ss-submit-text">Submit</span>
            <span id="ss-submit-spinner" class="spinner" style="display:none;"></span>
          </button>
          <button class="btn-delete" onclick="closeModal('add-ss-modal')">Cancel</button>
        </div>
      </div>
    </div>

    <!-- add Radio Image -->
    <div class="modal" id="add-rd-modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeModal('add-rd-modal')">&times;</span>
        <h3>Add Radio Image Type</h3>
        <label for="add-rd-type">Radio Image Type</label>
        <input type="number" id="add-rd-type" placeholder="Radio Image Type" min="0">


        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:15px;">
          <button class="btn-add" id="submit-rd-btn" onclick="">
            <span id="rd-submit-text">Submit</span>
            <span id="rd-submit-spinner" class="spinner" style="display:none;"></span>
          </button>
          <button class="btn-delete" onclick="closeModal('add-rd-modal')">Cancel</button>
        </div>
      </div>
    </div>

    <div class="modal" id="delete-confirm-modal">
      <div class="modal-content delete-modal">
        <h3 class="modal-title">Confirm Delete</h3>
        <p id="delete-message">Are you sure?</p>
        <input type="hidden" id="delete-id" />
        <div class="delete-actions">
          <button class="btn-confirm" id="confirm-delete-btn">
            <span id="delete-text">Yes, Delete</span>
            <span id="delete-spinner" class="spinner" style="display:none;"></span>
          </button>
          <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
        </div>
      </div>
    </div>


</body>
<script src="/static/js/notification.js?v={{version}}"></script>
<script src="/static/js/doctor.js?v={{version}}"></script>

</html>
