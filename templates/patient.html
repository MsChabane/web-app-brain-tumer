<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient - Ustay</title>
    <link rel="stylesheet" href="/static/css/patient.css?v={{version}}">
    <link rel="stylesheet" href="/static/css/notifications.css?v={{version}}">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

</head>

<body>

    <div class="sidebar">
        <h2>UStay Patient</h2>
        <a href="#" class="tab-link active" data-tab="info">Information</a>
        <a href="#" class="tab-link" data-tab="profile">Profile</a>
        <div class="sidebar-spacer"></div>


        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>

    <main class="main-content">
        <div class="notification" id="notification"></div>
        <!-- info-tab -->
        <div class="tab-content active" id="info-tab">
            <h2>Personal Information</h2>
            <table class="info-table" id="patient-info">
            </table>

            <h2>General Symptoms</h2>
            <table class="info-table" id="general-symptoms-info">
            </table>

            <h2>Specific Symptoms</h2>
            <table class="info-table" id="specific-symptoms-info">
            </table>

            <h2>Radio Images</h2>
            <table class="info-table" id="radio-image-info">
            </table>
        </div>

        <!-- profile tab -->
        <div class="tab-content" id="profile-tab" style="display:none;">
            <div class="header">
                <h2>Profile</h2>
            </div>

            <div class="profile-info" style="margin-bottom: 20px;">
                <p><strong>Phone Number:</strong> <span id="user-phone"> - </span></p>
                <p><strong>Role:</strong> <span id="user-role"> - </span></p>
            </div>

            <button class="btn-update" id="change-password-btn" onclick="openModal('change-password-modal')">Change
                Password</button>
        </div>

        <!-- Change Password Modal -->
        <div class="modal" id="change-password-modal">
            <div class="modal-content">
                <span class="close-modal" id="close-password-modal"
                    onclick="closeModal('change-password-modal')">&times;</span>
                <h3>Change Password</h3>
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" placeholder="Enter new password">

                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm new password">

                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:15px;">
                    <button class="btn-add" id="submit-changepwd-btn" onclick="change_password()">
                        <span id="changepwd-submit-text">Submit</span>
                        <span id="changepwd-submit-spinner" class="spinner" style="display:none;"></span>
                    </button>
                    <button class="btn-delete" onclick="closeModal('change-password-modal')">Cancel</button>
                </div>
            </div>
        </div>

    </main>
    <script src="/static/js/patient.js?v={{version}}"></script>
    <script src="/static/js/notification.js?v={{version}}"></script>


</body>

</html>
